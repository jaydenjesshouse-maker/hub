<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Our Hub</title>

<!-- This is what makes it open full screen, with its icon, instead of in Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Hub">
<meta name="application-name" content="Our Hub">
<!-- every screen opens on the roasted hero, so the clock and battery are drawn light over it -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1D13">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">

<style>
  html,body{margin:0;padding:0;height:100%;background:#2A1D13;overscroll-behavior:none}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#2A1D13}
  #boot{position:fixed;inset:0;display:grid;place-items:center;font:500 17px/1.4 ui-serif,"New York",Georgia,serif;
        color:#CAAE92;background:#2A1D13;transition:opacity .4s}
  #boot.gone{opacity:0;pointer-events:none}
  /* measures the phone's safe areas, which the app inside the frame can't read */
  #probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
         padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  /* Drop 8: the box that asks for notifications. Only this page may ask, not the app inside. */
  #ask{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(14,9,6,.55)}
  #ask.on{display:flex}
  #ask .box{width:100%;max-width:520px;background:#EFE5DA;color:#24180F;border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));
            font:16px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  #ask h2{font:500 26px/1.15 ui-serif,"New York",Georgia,serif;margin:0 0 8px}
  #ask p{margin:0 0 20px;color:#6F5A48}
  #ask button{display:block;width:100%;border:0;border-radius:99px;padding:15px;font:600 17px -apple-system,system-ui,sans-serif;margin-top:10px}
  #ask .yes{background:#2A1D13;color:#F4E2D4}#ask .no{background:#E7DACB;color:#24180F}
  @media (prefers-color-scheme:dark){ #ask .box{background:#221912;color:#F3E8DC} #ask p{color:#B9A18B} #ask .yes{background:#F4E2D4;color:#2A1D13} #ask .no{background:#33261C;color:#F3E8DC} }
</style>
</head>
<body>

<div id="boot">Opening…</div>
<div id="probe"></div>
<div id="ask" role="dialog" aria-modal="true" aria-labelledby="askT"><div class="box"><h2 id="askT">Turn on notifications?</h2><p id="askP">So you hear when the other one of you changes something, without opening the hub.</p><button class="yes" id="askY">Turn on</button><button class="no" id="askN">Not now</button></div></div>

<!-- PASTE YOUR /exec LINK BETWEEN THE QUOTES BELOW -->
<iframe id="app" title="Our Hub" src="https://script.google.com/macros/s/AKfycbxmAmtwekeyApcD76hpuZ2FBYz5p_1J8aBqm6Pwob1Qvui5CLvaibSJDjkykt-i0Yuecg/exec" allow="clipboard-write"></iframe>

<script>
(function(){
  /* a different key from the money app's wrapper, which lives on the same github.io address */
  var KEY = "hub-code";
  var ME  = "hub-me";
  var LAST = "hub-last";   // Drop 10: the last copy of the hub, on this phone only
  var DEV  = "hub-dev";    // Drop 10.1: which device this is
  var frame = document.getElementById("app");
  var boot  = document.getElementById("boot");
  var probe = document.getElementById("probe");
  var appWin = null;
  /* ?go=add|shop|balance from the icon's shortcuts; taken off the address so a refresh doesn't repeat it */
  var GOQ = ""; try{ var gm = String(location.search).match(/[?&]go=(add|shop|balance)\b/); if (gm) { GOQ = gm[1]; history.replaceState(null, "", location.pathname); } }catch(e){}

  function stored(){ try{ return localStorage.getItem(KEY) || ""; }catch(e){ return ""; } }
  function insets(){
    var cs = getComputedStyle(probe);
    return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
  }
  function sendInsets(){
    if (!appWin) return;
    var i = insets();
    try{ appWin.postMessage({hub:"insets", top:i.top, bottom:i.bottom}, "*"); }catch(e){}
  }

  /* The app lives on Google's address, so Safari keeps its storage apart from
     this page's. This page remembers the code and hands it over, so neither of
     you types it every time the hub opens. */
  window.addEventListener("message", function(ev){
    var m = ev && ev.data;
    /* Apps Script nests the app a frame or two deep inside Google's own pages,
       so the message comes from that inner window, not the iframe here. Reply
       to whichever window wrote. */
    if (!m || !m.hub || !ev.source || ev.source === window) return;
    if (m.hub === "ready") {
      appWin = ev.source;
      sendInsets();
      var c = stored();
      var who = ""; try{ who = localStorage.getItem(ME) || ""; }catch(e){}
      var dev = ""; try{ dev = localStorage.getItem(DEV) || ""; }catch(e){}
      if (c) { try{ ev.source.postMessage({hub:"code", code:c, me:who, dev:dev}, "*"); }catch(e){} }
      /* Drop 10.2: opened from a press-and-hold shortcut on the icon (Android) */
      if (c && GOQ) { try{ ev.source.postMessage({hub:"go", go:GOQ}, "*"); }catch(e){} GOQ = ""; }
      /* Drop 10: the last copy, so the hub draws straight away and then catches up */
      if (c) { try{ var last = JSON.parse(localStorage.getItem(LAST) || "null"); if (last && last.state) ev.source.postMessage({hub:"cached", state:last.state, rev:last.rev, base:last.base||null, dirty:!!last.dirty}, "*"); }catch(e){} }
    }
    if (m.hub === "cache") {
      try{ if (m.state) localStorage.setItem(LAST, JSON.stringify({state:m.state, rev:m.rev||0, base:m.base||null, dirty:!!m.dirty, at:Date.now()})); else localStorage.removeItem(LAST); }catch(e){}
    }
    /* Drop 10.1: this device's own id, so the hub can tell your iPhone from your iPad */
    if (m.hub === "setdev" && typeof m.id === "string") { try{ localStorage.setItem(DEV, m.id); }catch(e){} }
    if (m.hub === "setme" && typeof m.me === "string") {
      try{ localStorage.setItem(ME, m.me); }catch(e){}
    }
    /* Drop 10.2: a little buzz when something's ticked (Android; iPhones don't allow it) */
    if (m.hub === "buzz") { try{ if (navigator.vibrate) navigator.vibrate(12); }catch(e){} }
    if (m.hub === "setcode" && typeof m.code === "string") {
      try{ localStorage.setItem(KEY, m.code); }catch(e){}
    }
  });
  window.addEventListener("resize", sendInsets);
  window.addEventListener("orientationchange", function(){ setTimeout(sendInsets, 300); });

  /* ---------- Drop 8: notifications ---------- */
  var ask = document.getElementById("ask"), askKey = "", askMe = "";
  function reply(msg){ if (appWin) { try{ appWin.postMessage(msg, "*"); }catch(e){} } }
  function standalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
  var swReg = null;
  if ("serviceWorker" in navigator) { try{ navigator.serviceWorker.register("sw.js").then(function(r){ swReg = r; }).catch(function(){}); }catch(e){} }
  /* Drop 9: if the first try didn't take, try again now, and wait up to 15
     seconds for it to be ready (a slow signal can take more than 5). */
  function reg(){
    return new Promise(function(res, rej){
      if (!("serviceWorker" in navigator)) return rej("nosw");
      var t = setTimeout(function(){ rej("timeout"); }, 15000);
      navigator.serviceWorker.getRegistration().then(function(r){ return r || navigator.serviceWorker.register("sw.js"); })
        .then(function(){ return navigator.serviceWorker.ready; })
        .then(function(r){ clearTimeout(t); res(r); }, function(e){ clearTimeout(t); rej(e); });
    });
  }
  /* why it didn't work, in words: most often sw.js isn't on GitHub next to this page */
  function whyNot(e, cb){
    var m = String(e && e.message || e || "");
    fetch("sw.js", {cache: "no-store"}).then(function(r){
      if (!r.ok) return cb("This page can’t find sw.js (" + r.status + "). Upload sw.js to GitHub next to index.html, wait a minute, then close the hub and open it again from its icon.");
      if (m === "timeout") return cb("The phone didn’t finish setting up in time. Close the hub fully (swipe it away), open it again from its icon, and try once more.");
      cb("The phone said no (" + m + ").");
    }).catch(function(){ cb(m === "timeout" ? "No signal, or the phone didn’t finish setting up. Try again with a signal." : "The phone said no (" + m + ")."); });
  }
  function pushState(cb){
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
      return cb({state:"unsupported", why: /iPhone|iPad/.test(navigator.userAgent) && !standalone() ? "ios-tab" : "browser"});
    if (Notification.permission === "denied") return cb({state:"denied"});
    reg().then(function(r){ return r.pushManager.getSubscription(); })
      .then(function(sub){ cb({state: sub && Notification.permission === "granted" ? "on" : "off", endpoint: sub ? sub.endpoint : ""}); })
      .catch(function(){ cb({state:"off"}); });
  }
  /* what the service worker needs to ask the script what's new */
  function saveCfg(){
    if (!("caches" in window)) return;
    var who = ""; try{ who = localStorage.getItem(ME) || ""; }catch(e){}
    var cfg = {exec: frame.src, code: stored(), me: who};
    try{ caches.open("hub-push").then(function(c){ return c.put("cfg", new Response(JSON.stringify(cfg), {headers:{"Content-Type":"application/json"}})); }).catch(function(){}); }catch(e){}
  }
  function keyBytes(b64){ b64 = b64.replace(/-/g, "+").replace(/_/g, "/"); while (b64.length % 4) b64 += "="; var raw = atob(b64), out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out; }
  document.getElementById("askN").addEventListener("click", function(){ ask.classList.remove("on"); reply({hub:"pusherr", msg:"Not now. You can turn them on from the bell any time."}); });
  document.getElementById("askY").addEventListener("click", function(){
    ask.classList.remove("on");
    /* this tap is the permission request: phones only allow it straight from a tap on this page */
    Notification.requestPermission().then(function(p){
      if (p !== "granted") { reply({hub:"pushstate", state: p === "denied" ? "denied" : "off"}); return; }
      return reg().then(function(r){ return r.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:keyBytes(askKey)}); })
        .then(function(sub){ saveCfg(); reply({hub:"pushsub", sub: sub.toJSON(), me: askMe}); reply({hub:"pushstate", state:"on", endpoint: sub.endpoint}); });
    }).catch(function(e){ whyNot(e, function(msg){ reply({hub:"pusherr", msg: msg}); }); });
  });
  window.addEventListener("message", function(ev){
    var m = ev && ev.data;
    if (!m || !m.hub || !ev.source || ev.source === window) return;
    if (m.hub === "pushstate?" || m.hub === "ready") { appWin = appWin || ev.source; pushState(function(o){ o.hub = "pushstate"; reply(o); if (o.state === "on") saveCfg(); }); }
    if (m.hub === "pushask" && typeof m.key === "string") {
      appWin = ev.source; askKey = m.key; askMe = m.me || "";
      if (m.other) document.getElementById("askP").textContent = "So you hear when " + m.other + " changes something, without opening the hub.";
      ask.classList.add("on");
    }
    if (m.hub === "pushoff") {
      reg().then(function(r){ return r.pushManager.getSubscription(); }).then(function(sub){
        var ep = sub ? sub.endpoint : ""; return (sub ? sub.unsubscribe() : true).then(function(){ reply({hub:"pushstate", state:"off", left: ep}); });
      }).catch(function(){ reply({hub:"pushstate", state:"off"}); });
    }
    if (m.hub === "badge" && typeof m.n === "number") {
      try{ if (m.n > 0 && navigator.setAppBadge) navigator.setAppBadge(m.n); else if (navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){}
    }
  });

  /* ---------- Drop 9: the back button (Android) ----------
     While the hub has a panel or a page open, this page holds one step of
     history. Back takes that step instead of leaving the hub; we tell the
     hub, and it closes the panel or goes back a page. */
  var guard = false, unguarding = false;
  window.addEventListener("message", function(ev){
    var m = ev && ev.data;
    if (!m || m.hub !== "canback" || !ev.source || ev.source === window) return;
    appWin = appWin || ev.source;
    if (m.on && !guard) { guard = true; try{ history.pushState({hubBack: 1}, ""); }catch(e){ guard = false; } }
    else if (!m.on && guard) { guard = false; if (history.state && history.state.hubBack) { unguarding = true; history.back(); } }
  });
  window.addEventListener("popstate", function(){
    if (unguarding) { unguarding = false; return; }
    if (guard) { guard = false; reply({hub:"back"}); }
  });

  frame.addEventListener("load", function(){ boot.classList.add("gone"); });
  setTimeout(function(){ boot.classList.add("gone"); }, 6000);
})();
</script>
</body>
</html>
