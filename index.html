<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Turnout</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnout">
<meta name="application-name" content="Turnout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E2638">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Turnout · colour styles
   Ink #17181C · Cream #F5F1EA · Paper #EFEAE1 · Linen #E4DDD1 · Stone line #D8D0C3 · Ash #5B5852
   The outfit colours (--c1 over --c2) come from what you're wearing. */
:root{
  --ink:#17181C; --cream:#F5F1EA; --paper:#EFEAE1; --linen:#E4DDD1; --line:#D8D0C3; --ash:#5B5852;
  --plinth:#F3EFE7; --line2:#CFC7B9; --dash:#9E968A; --wash:#DCE3EA; --tint:rgba(23,24,28,.07); --glass:rgba(245,241,234,.86); --sand:#E7D9B8; --mute:#9A9286;
  --c1:#1E2638; --c2:#CFC6B8; --t1:#F5F1EA; --t2:#17181C; --split:420px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
.ic{display:block;flex:none}
#view{min-height:100%;padding-bottom:calc(96px + var(--sb))}
.scr{min-height:100vh;padding:calc(var(--st) + 10px) 20px 24px;position:relative}
.scr.field{background:linear-gradient(var(--c1) 0 var(--split), var(--c2) var(--split));transition:background .5s}
.scr.field.light-top::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(var(--st) + 8px);background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0));z-index:30;pointer-events:none}
.on1{color:var(--t1)} .on2{color:var(--t2)}

/* brand + top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.word{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:500;font-size:16px;letter-spacing:-.02em}
.word svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 10px;border-radius:15px;background:var(--tint);white-space:nowrap}
.on1 .chip,.dk .chip{background:rgba(245,241,234,.15)}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--tint)}
.on1 .iconbtn{background:rgba(245,241,234,.14)}
.kick{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:12px;opacity:.82}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:-.045em;line-height:1;margin:6px 0 0}
h1.mono{font-size:clamp(34px,11vw,46px);text-transform:uppercase}
h2.mono{font-size:clamp(28px,8.5vw,38px)}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* the outfit card */
.plinth{position:relative;margin-top:18px;border-radius:28px;background:var(--plinth);box-shadow:0 20px 40px rgba(10,14,24,.22);padding:14px 14px 34px;display:flex;justify-content:center;min-height:200px}
.plinth .flat{height:min(62vh,320px);width:auto;opacity:0;transition:opacity .35s}
.plinth .flat.in{opacity:1}
.plinth .cap{position:absolute;left:18px;right:18px;bottom:12px;display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ash)}
.plinth .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{position:absolute;top:10px;display:flex;flex-direction:column;gap:8px;right:10px}
.rate button{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--tint);color:var(--ink)}
.rate button.on{background:var(--ink);color:var(--cream)}
.why{margin:14px 2px 0;font-size:15px;line-height:1.4}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{height:50px;border-radius:25px;display:inline-flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:600;font-size:16px;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--cream)}
.btn.sec{box-shadow:inset 0 0 0 1.5px currentColor}
.btn.lite{background:var(--cream);color:var(--ink)}
.field .on2 .btn.pri,.field-sheet .on2 .btn.pri{background:var(--t2);color:var(--c2)}
.field .on1 .btn.pri{background:var(--t1);color:var(--c1)}
.btn.done{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.wide{width:100%;justify-content:center}
.btn:active,.iconbtn:active,.tile:active,.mini:active{transform:scale(.97)}

/* cards and rows */
.card{margin-top:18px;border-radius:22px;background:var(--paper);padding:16px;color:var(--ink)}
.card.dk{background:var(--ink);color:var(--cream)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.sec-h a,.sec-h button{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.minis{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:84px;scroll-snap-align:start;font-size:12px;line-height:15px;position:relative;text-align:left}
.mini .pl{width:84px;height:84px;border-radius:14px;background:var(--linen);display:flex;justify-content:center;overflow:hidden}
.mini .pl img{height:80px;margin-top:2px;width:auto}
.bar2{display:flex;height:4px;margin-top:5px;border-radius:2px;overflow:hidden}.bar2 i{flex:1}
.mini b{display:block;padding-top:4px;font-weight:600}.mini span{opacity:.75}
.mini .badge{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:11px;background:var(--cream);color:var(--ink);display:grid;place-items:center}

.row{display:grid;grid-template-columns:46px 66px 1fr 8px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row.now{background:var(--paper);margin:0 -12px;padding:8px 12px;border-radius:16px;border-color:transparent;width:calc(100% + 24px)}
.row .d b{display:block;font-family:var(--mono);font-weight:500;font-size:15px}.row .d span{font-size:12px;color:var(--ash)}
.row .pl{width:66px;height:66px;border-radius:12px;background:var(--linen);overflow:hidden;display:flex;justify-content:center}
.row .pl img{height:62px;width:auto;margin-top:2px}
.row .t{font-size:14px;line-height:18px;min-width:0}.row .t b{display:block;font-weight:600}
.occ{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ash)}
.vbar{width:8px;height:46px;border-radius:4px;overflow:hidden;display:flex;flex-direction:column}.vbar i{flex:1}
.crowd{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--linen);font-size:11px;font-weight:600;color:var(--ink)}
.strip{display:flex;gap:4px;align-items:center;margin-top:14px}.strip i{width:40px;height:40px;border-radius:8px;flex:none}
.strip span{margin-left:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ash)}

/* wardrobe */
.seg{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 0;padding:0 20px 2px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:9px 14px;border-radius:19px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.seg button.on{background:var(--ink);color:var(--cream);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:16px}
.tile{text-align:left;position:relative}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--paper)}
.tile b{display:block;font-weight:600;font-size:14px;padding-top:6px}.tile span{color:var(--ash);font-size:13px}
.tile .tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:14px;background:rgba(245,241,234,.9);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tile.sel .tick{background:var(--ink);color:var(--cream)}
.tile.sel img{outline:3px solid var(--ink);outline-offset:-3px}
.selbar{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--sb));z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;border-radius:30px;background:var(--ink);color:var(--cream);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.gap{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.gap .sw{width:56px;height:56px;border-radius:12px}
.empty{padding:22px;border-radius:20px;background:var(--paper);font-size:15px;line-height:1.45;margin-top:16px}

/* tab bar */
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(10px + var(--sb));height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;z-index:50;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);color:var(--ash)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;width:72px;padding:6px 0}
.tab.on{color:var(--ink)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(14,14,18,.4);opacity:0;transition:opacity .25s}
.sheet.open .scrim{opacity:1}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--st) - 8px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;background:var(--cream);
  padding:10px 20px calc(24px + var(--sb));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:none}
.sheet.full .panel{top:0;max-height:none;border-radius:0;padding-top:calc(var(--st) + 6px)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.field-sheet{background:linear-gradient(var(--c1) 0 var(--split), var(--c2) var(--split)) !important;transition:background .45s}

/* dress me */
.occs{display:flex;gap:8px;overflow-x:auto;margin:10px -20px 0;padding:0 20px 2px;scrollbar-width:none}.occs::-webkit-scrollbar{display:none}
.occs button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 11px;border-radius:18px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
.occs button.on{background:var(--ink);color:var(--cream);box-shadow:none;opacity:1}
.on1 .occs button.on{background:var(--cream);color:var(--ink)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:16px -20px 0;padding:0 20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .plinth{flex:none;width:calc(100vw - 40px);max-width:460px;scroll-snap-align:center;margin-top:0}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.35}.dots i.on{width:18px;opacity:1}
.pieces{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.pc{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center;padding:6px;border-radius:16px;background:rgba(245,241,234,.14);font-size:13px;font-weight:600;min-width:0}
.on2 .pc{background:var(--tint)}
.pc img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.pc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc button{width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.pc button.on{background:currentColor}.pc button.on svg{color:var(--c2)}

/* forms */
.form label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);margin:16px 0 6px}
.form input[type=text],.form input[type=number],.form input[type=url],.form input[type=password],.form select,.form textarea{width:100%;height:48px;border-radius:14px;border:0;background:var(--paper);padding:0 14px;font-size:16px}
.form textarea{height:90px;padding:12px 14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:9px 13px;border-radius:17px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.pills button.on{background:var(--ink);color:var(--cream);box-shadow:none}
.preview{border-radius:22px;background:var(--plinth);display:grid;place-items:center;padding:16px;min-height:220px}
.preview img{max-height:260px;width:auto}
.swatchrow{display:flex;gap:10px;align-items:center}
.swatchrow input[type=color]{width:48px;height:48px;border:0;border-radius:14px;padding:0;background:none}
.note{font-size:14px;line-height:1.45;color:var(--ash);margin:10px 0 0}
.hr{height:1px;background:var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:last-child{color:var(--ash);text-align:right}
.pair{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pair button{text-align:left;font-size:12px}
.pair img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.toggle{display:inline-flex;border-radius:16px;background:var(--paper);padding:3px}
.toggle button{padding:6px 12px;border-radius:13px;font-size:13px;font-weight:600}
.toggle button.on{background:var(--ink);color:var(--cream)}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,20px);opacity:0;z-index:120;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:22px;font-size:15px;font-weight:600;transition:all .25s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px}
.boot svg{width:72px;height:72px;margin:0 auto 14px}
.skel{background:linear-gradient(90deg,var(--tint),rgba(23,24,28,.1),var(--tint));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.scr,.panel>*{max-width:620px;margin-left:auto;margin-right:auto}.grid{grid-template-columns:repeat(3,1fr)}.carousel .plinth{width:460px}}

/* ---- v1.2: Wardrobe · Shop · Balance ---- */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding:3px;border-radius:22px;background:var(--linen)}
.seg3 button{height:38px;border-radius:19px;font-size:14px;font-weight:600;color:var(--ash)}
.seg3 button.on{background:var(--ink);color:var(--cream)}
.washbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--wash);font-size:14px;line-height:1.35}
.washbar span{flex:1}.washbar button{height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:var(--cream);font-weight:600;font-size:14px}
.tile.dirty img{opacity:.45}
.wbadge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:11px;background:var(--ink);color:var(--cream) !important;font-size:11px !important;font-weight:600}
.swt{flex:none;display:grid;place-items:center;border-radius:16px;box-shadow:inset 0 0 0 1px var(--tint)}
.n{flex:none;text-align:right;line-height:1}.n b{display:block;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:-.04em}.n span{font-size:11px;color:var(--ash)}
.br,.mb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.br-t{flex:1;min-width:0}.br-t b,.mb b{display:block;font-size:16px;font-weight:600}.br-t>span,.mb span>span:not(.vd){display:block;font-size:13px;color:var(--ash);line-height:1.35;margin-top:2px}
.br.open{border-top:0;margin-top:4px;padding:14px;border-radius:20px 20px 0 0;background:var(--paper)}
.br-x{padding:0 14px 14px;border-radius:0 0 20px 20px;background:var(--paper);margin-bottom:6px}
.mb img{width:56px;height:56px;object-fit:contain;border-radius:14px;background:var(--plinth);flex:none;outline:1.5px dashed var(--dash);outline-offset:-5px}
.mb>span:nth-child(2){flex:1;min-width:0}
.vd{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:7px;margin-bottom:4px}
.vd.yes{background:#2F4A35;color:#F5F1EA}.vd.ok{background:#E7D9B8;color:#17181C}.vd.close,.vd.no{background:#E9D3CC;color:#6A2A1E}
.oc{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;line-height:1.3}
.oc+.oc{border-top:1px solid var(--tint)}
.oc-b{flex:none;width:34px;height:44px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:inset 0 0 0 1px var(--tint)}
.oc-b i{flex:1}.oc-b i:first-child{flex:1.15}.oc-b i.col{position:absolute;left:11px;top:0;width:12px;height:7px;border-radius:0 0 6px 6px}
.oc span b{font-weight:700}
/* Balance */
.bal{width:100%;margin-top:16px;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.bal th{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;color:var(--ash);text-align:left;padding:2px}
.bal tr th:first-child{width:72px;font-size:10px}
.bal td{height:52px;border-radius:12px;background:var(--paper);padding:6px;vertical-align:top}
.bal td i{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 3px 3px 0;box-shadow:inset 0 0 0 1px rgba(23,24,28,.15)}
.bal td.gapc{background:transparent;outline:1.5px dashed var(--dash);outline-offset:-2px}
.bal td.na{background:repeating-linear-gradient(135deg,var(--linen) 0 6px,var(--paper) 6px 12px)}
.bal-k{display:flex;gap:16px;font-size:12px;color:var(--ash);margin-top:8px}.bal-k span{display:inline-flex;align-items:center;gap:6px}
.bal-k i{width:14px;height:14px;border-radius:4px}.bal-k i.g{outline:1.5px dashed var(--dash);outline-offset:-2px}.bal-k i.n{background:repeating-linear-gradient(135deg,var(--linen) 0 3px,var(--paper) 3px 6px)}
.hbar{display:flex;height:34px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--tint)}.hbar i{flex:1}
.pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:20px;padding:14px;border-radius:22px;background:var(--ink);color:var(--cream);text-align:left}
.pick>span{flex:1}.pick b{display:block;font-size:17px;margin:3px 0 2px}.pick span span{font-size:13px;opacity:.82}
/* one buy / one maybe */
.bigN{display:flex;align-items:baseline;gap:10px;margin-top:14px}.bigN b{font-family:var(--mono);font-weight:500;font-size:64px;letter-spacing:-.05em;line-height:.9}.bigN span{font-size:15px;max-width:16ch;line-height:1.3}
.bigN.dark b{font-size:52px}
.occn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.occn span{padding:10px 8px;border-radius:14px;background:var(--paper);font-size:12px;color:var(--ash)}.occn b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;color:var(--ink);letter-spacing:-.03em}
a.btn{text-decoration:none;color:inherit}

<script>
/* ============================================================
   Turnout · the fashion brain
   Scores every possible outfit from your wardrobe and picks the
   best for the occasion, the weather and what you've worn lately.
   Pure functions: no screen, no network. Runs in the app and in tests.
   ============================================================ */
var Brain = (function () {
  'use strict';

  /* ---------- colour ---------- */
  function rgb(hex) {
    hex = String(hex || '#888888').replace('#', '');
    if (hex.length === 3) hex = hex.replace(/./g, '$&$&');
    var n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

    var c = rgb(hex).map(function (v) { return v / 255; });

    if (max !== min) {

      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === c[0]) h = (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0);
      else if (max === c[1]) h = (c[2] - c[0]) / d + 2;
      else h = (c[0] - c[1]) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l };
  }
  function neutral(c) { return c.s < 0.2 || c.l < 0.2 || (c.l > 0.75 && c.s < 0.35); }
  function patterned(x) { return !!x && !!x.pattern && x.pattern !== 'plain'; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* How well two pieces sit together, 0 to 1 */
  function harmony(a, b) {
    if (!a || !b) return 0.75;
    var A = hsl(a.hex), B = hsl(b.hex), h;
    var nA = neutral(A), nB = neutral(B);

    else {
      var d = Math.abs(A.h - B.h); d = Math.min(d, 360 - d);

    }
    var c = Math.abs(A.l - B.l);
    if (c < 0.08) h -= 0.35; else if (c < 0.15) h -= 0.15; else if (c <= 0.6) h += 0.05;
    if (a.texture === 'denim' && b.texture === 'denim') h -= 0.3;

    return clamp(h, 0, 1);
  }
  function contrast(a, b) { return Math.abs(hsl(a.hex).l - hsl(b.hex).l); }

  /* ---------- occasions ---------- */
  var OCC = {
    work:    { label: 'Work',      smart: 3,   icon: 'work' },

    party:   { label: 'Party',     smart: 4,   icon: 'party' },
    trip:    { label: 'Trip',      smart: 3,   icon: 'trip' },
    weekend: { label: 'Weekend',   smart: 2,   icon: 'weekend' },
