<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2A1D13">
<title>Wishlist</title>
<link rel="apple-touch-icon" href="icon-180.png">
<!-- V14.4.5: a wishlist from Our Hub, shared with family (design A, the hub's own wishlist as a page).
     The link is made in the other one's hub: #k=<who made it>.<key>&s=<the script>. Everything after # stays in the
     browser, so GitHub never sees the key. The script answers in JSON and never says who has got what to the one whose
     list it is. This page keeps a random code in this browser, so it can say "You've got this" and undo it. -->
<style>
  :root{color-scheme:light;--esp:#2A1D13;--cream:#EFE5DA;--card:#FBF6F0;--card2:#EFE5DA;--ink:#2A1D13;--ink2:#6F5A48;--walnut:#734C23;--line:rgba(90,58,27,.18);
    --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
  a{color:inherit}
  button{font:inherit;border:0;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .hd{background:var(--esp);color:#F4E2D4;padding:calc(30px + env(safe-area-inset-top,0px)) 22px 24px;border-radius:0 0 30px 30px}
  .ey{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#CAAE92}
  h1{font:400 40px/1 var(--serif);letter-spacing:-.6px;margin:10px 0 0}
  .note{margin:14px 0 0;font-size:15px;line-height:1.5;color:#E8D3C0}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 12px 4px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));padding:18px 16px 4px}.hd{border-radius:0 0 34px 34px}}
  .c{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .im{height:118px;display:grid;place-items:center;color:rgba(42,29,19,.4);background:var(--card2) center/cover no-repeat;position:relative;text-decoration:none}
  .im svg{width:34px;height:34px}
  .ex{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(251,246,240,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ex svg{width:14px;height:14px}
  .bd{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .kd{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--ink2)}
  .kd.love{background:#F3DCCB;color:#8C4A26}
  .kd.idea{background:#2A1D14;color:#F4E2D4}
  .sz{display:block;font-size:13px;color:var(--ink2);margin-top:1px}   /* V14.4.7: a Turnout wish's colour and size */   /* V14.4.6: the other one's idea, not theirs */
  .t{font-size:14.5px;font-weight:500;line-height:1.25;text-decoration:none;word-break:break-word}
  .pr{font:500 19px var(--serif)}
  .sh{font-size:12.5px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;align-self:flex-start}
  .go{margin-top:auto;padding-top:8px}
  .b{width:100%;height:38px;border-radius:99px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
  .b.get{background:var(--esp);color:#F4E2D4}
  .b.gone{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
  .b.mine{background:#E3EEE5;color:#2F6A4C}.b.mine svg{width:15px;height:15px}.b.mine u{font-weight:500;margin-left:8px}
  .c.taken .im{opacity:.42}.c.taken .t,.c.taken .pr{color:var(--ink2)}
  .foot{font-size:13px;color:var(--ink2);text-align:center;padding:14px 26px 0;line-height:1.45}
  .msg{padding:60px 26px;text-align:center;color:var(--ink2);font-size:16px;line-height:1.5}
  .msg b{display:block;font:400 26px var(--serif);color:var(--ink);margin-bottom:8px}
  .scrim{position:fixed;inset:0;background:rgba(20,12,6,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .scrim.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
  .grab{width:40px;height:5px;border-radius:9px;background:rgba(0,0,0,.18);margin:0 auto 16px}
  .gi{width:52px;height:52px;border-radius:16px;background:#F3DCCB;color:#8C4A26;display:grid;place-items:center;margin:0 auto 10px}.gi svg{width:26px;height:26px}
  .sheet h2{font:400 26px/1.15 var(--serif);margin:0 0 6px}
  .sheet p{font-size:15px;color:#4A3627;margin:0 0 16px;line-height:1.45}
  .sheet .y{display:block;width:100%;height:50px;border-radius:99px;background:var(--esp);color:#F4E2D4;font-weight:600;font-size:16px}
  .sheet .nm{display:block;text-align:left;font-size:14px;font-weight:600;color:var(--ink);margin:0 2px 6px}
  .sheet .nm small{display:block;font-weight:400;color:var(--ink2);font-size:13px;margin-top:1px}
  .sheet .nmi{display:block;width:100%;box-sizing:border-box;height:46px;border-radius:14px;border:1px solid #D9C8B8;background:#FFFDFB;padding:0 14px;font:16px var(--sans,inherit);color:var(--ink);margin-bottom:14px}
  .b.gone.who{max-width:100%;white-space:normal;line-height:1.25;height:auto;min-height:40px;padding:8px 12px}   /* V14.4.10: who's getting it */
  .sheet .n{display:block;width:100%;height:46px;border-radius:99px;background:transparent;color:var(--ink2);font-weight:600;font-size:15px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--esp);color:#F4E2D4;padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  .skel{height:250px;border-radius:18px;background:linear-gradient(90deg,#F4ECE3,#FBF6F0,#F4ECE3);background-size:200% 100%;animation:sk 1.4s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><div class="ey" id="ey">Wishlist</div><h1 id="h">A wishlist</h1><p class="note" id="note" hidden></p></div>
  <div id="main"><div class="grid"><div class="skel"></div><div class="skel"></div></div></div>
</div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sT"><div class="sheet"><div class="grab"></div><div class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg></div>
  <h2 id="sT">Getting this?</h2><p id="sP"></p><label class="nm" for="sNm">Your first name<small>Optional. Shows who’s getting it</small></label><input id="sNm" class="nmi" maxlength="24" autocomplete="given-name" autocapitalize="words" placeholder="Mum"><button class="y" id="sY">Yes, I’m getting it</button><button class="n" id="sN">Not yet</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  var IC={box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
    ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
  function q(id){ return document.getElementById(id); }
  function poss1446(n){ n=String(n||""); return /s$/i.test(n)?n+"’":n+"’s"; }   /* Jess’, never Jess’s */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(v){ v=Number(v); if(!(v>0)) return ""; return "£"+v.toLocaleString("en-GB",{minimumFractionDigits:v%1?2:2,maximumFractionDigits:2}); }
  function host(u){ var m=/^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(String(u||"")); return m?m[1]:""; }
  function okUrl(u){ return /^https?:\/\//i.test(String(u||"")); }
  function okImg(u){ return /^(https?:|data:image\/(png|jpe?g|webp|gif);base64,)/i.test(String(u||"")); }
  var H={}; String(location.hash||"").replace(/^#/,"").split("&").forEach(function(p){ var i=p.indexOf("="); if(i>0) H[p.slice(0,i)]=decodeURIComponent(p.slice(i+1)); });
  var K=/^[a-z]{2,20}\.[a-f0-9]{32,64}$/.test(H.k||"")?H.k:"", S=/^[A-Za-z0-9_-]{20,}$/.test(H.s||"")?H.s:"";
  var EXEC=S?"https://script.google.com/macros/s/"+S+"/exec":"";
  /* this browser's own code: what it marks, it can undo */
  var C=""; try{ C=localStorage.getItem("wl1445-c")||""; }catch(e){}
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(C)){ var a=new Uint8Array(18); (window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach(function(_,i){ a[i]=Math.random()*256|0; });
    C=Array.prototype.map.call(a,function(b){ return "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"[b%64]; }).join(""); try{ localStorage.setItem("wl1445-c",C); }catch(e){} }
  var L=null, busy=false, pending=null, tt=0;
  function toast(t){ var el=q("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){ el.classList.remove("on"); },3200); }
  function fail(t){ q("main").innerHTML='<div class="msg"><b>'+esc(t[0])+'</b>'+esc(t[1])+'</div>'; }
  function ask(extra){ if(!K||!EXEC){ fail(["This link isn’t complete","Ask for the link again, and open it in full."]); return Promise.resolve(null); }
    /* V14.4.8: the browser's code goes as b=. Apps Script keeps c= for itself, and refuses any request that has one */
    return fetch(EXEC+"?q=wl&k="+encodeURIComponent(K)+"&b="+encodeURIComponent(C)+(extra||""),{redirect:"follow",credentials:"omit"}).then(function(r){ if(typeof r.text!=="function") return r.json();
      return r.text().then(function(t){ try{ return JSON.parse(t); }catch(e){ var er=new Error("notjson"); er.notjson=true; throw er; } }); }); }
  function draw(){ if(!L) return; var nm=L.name||"Their";
    document.title=poss1446(nm)+" wishlist"; q("ey").textContent="Wishlist"; q("h").innerHTML=esc(poss1446(nm))+"<br>wishlist";   /* V14.4.6: Jess’, never Jess’s */
    if(L.note){ q("note").textContent="“"+L.note+"”"; q("note").hidden=false; } else q("note").hidden=true;
    var xs=L.items||[];
    if(!xs.length){ q("main").innerHTML='<div class="msg"><b>Nothing on here right now</b>'+esc(nm)+' hasn’t added anything yet. Have another look nearer the time.</div>'; return; }
    var h='<div class="grid">'+xs.map(function(x){ var link=okUrl(x.link)?' href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer"':"", tag=link?"a":"span";
      var img=okImg(x.img)?' style="background-image:url(&quot;'+esc(String(x.img).replace(/["\\\n\r]/g,""))+'&quot;)"':"";
      /* V14.4.7: a wish from his wardrobe app with no photo shows its colour */
      var sw=!img&&x.kind==="turnout"&&/^#[0-9A-Fa-f]{6}$/.test(x.hex||"")?' style="background:'+x.hex+'"':"";
      var btn=x.mine?'<button class="b mine" data-un="'+esc(x.id)+'" aria-label="You’re getting this. Undo">'+IC.tick+'Yours<u>Undo</u></button>':x.taken?(x.who?'<span class="b gone who">'+esc(x.who)+' is getting this</span>':'<span class="b gone">Someone’s got this</span>'):'<button class="b get" data-get="'+esc(x.id)+'">I’ll get this</button>';
      return '<div class="c'+(x.taken&&!x.mine?" taken":"")+'"><'+tag+' class="im"'+link+(img||sw)+(link?' aria-label="'+esc(x.t)+', in the shop"':"")+'>'+(img||sw?"":IC.box)+(link?'<span class="ex">'+IC.ext+'</span>':"")+'</'+tag+'>'+
        '<div class="bd">'+(x.kind==="idea"?'<span class="kd idea">'+esc(poss1446(x.by||"Their")+" idea")+'</span>':'<span class="kd'+(x.kind==="think"?"":" love")+'">'+(x.kind==="think"?"Thinking of buying":"Would love")+'</span>')+
        (link?'<a class="t"'+link+'>'+esc(x.t)+'</a>':'<span class="t">'+esc(x.t)+'</span>')+(money(x.price)?'<span class="pr">'+money(x.price)+'</span>':"")+
        (x.kind==="turnout"&&(x.colour||x.size)?'<span class="sz">'+esc([x.colour,x.size?"Size "+x.size:""].filter(Boolean).join(" · "))+'</span>':"")+
        (link?'<a class="sh"'+link+'>'+esc(host(x.link))+'</a>':"")+'<div class="go">'+btn+'</div></div></div>'; }).join("")+'</div>'+
      '<div class="foot">Tap a picture to see it in the shop. When you’re getting something, tap I’ll get this, so nobody buys it twice. '+esc(nm)+' can’t see any of it.</div>';
    q("main").innerHTML=h; }
  function load(extra,after){ if(busy) return; busy=true;
    ask(extra).then(function(r){ busy=false; if(!r) return; if(!r.ok){ fail(["This link has stopped working",r.say||"Ask for a new one."]); return; } L=r; draw(); if(r.say) toast(r.say); else if(after) toast(after); })
      .catch(function(e){ busy=false; if(L){ draw(); toast("No signal. Try again in a minute."); }
        /* V14.4.8: with signal, a link that can't be opened is the link, not the phone */
        else if(navigator.onLine===false) fail(["Couldn’t open the list","Check your signal and try again in a minute."]);
        else fail(["This link isn’t working","Ask whoever sent it to send it to you again."]); }); }
  document.addEventListener("click",function(e){ var g=e.target.closest("[data-get]"), u=e.target.closest("[data-un]");
    if(g){ var x=(L.items||[]).filter(function(i){ return i.id===g.getAttribute("data-get"); })[0]; if(!x) return; pending=x.id;
      q("sT").textContent="Getting "+(x.t.length>40?"this":x.t)+"?"; q("sP").textContent=(L.name||"They")+" won’t know. Everyone else with the link sees it’s being got, so nobody buys it twice.";
      try{ q("sNm").value=localStorage.getItem("wl1445-n")||""; }catch(e){}
      q("scrim").classList.add("on"); q("sY").focus(); }
    if(u){ load("&unclaim="+encodeURIComponent(u.getAttribute("data-un")),"Unmarked. It’s free for anyone again."); } });
  q("sY").addEventListener("click",function(){ q("scrim").classList.remove("on"); var nm=String(q("sNm").value||"").replace(/\s+/g," ").trim().slice(0,24); try{ localStorage.setItem("wl1445-n",nm); }catch(e){}
    /* V14.4.10: the first name, if given, so everyone else sees who's getting it */
    if(pending) load("&claim="+encodeURIComponent(pending)+(nm?"&n="+encodeURIComponent(nm):""),"Marked as yours. Nobody else will get it."); pending=null; });
  q("sN").addEventListener("click",function(){ q("scrim").classList.remove("on"); pending=null; });
  q("scrim").addEventListener("click",function(e){ if(e.target===q("scrim")){ q("scrim").classList.remove("on"); pending=null; } });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ q("scrim").classList.remove("on"); pending=null; } });
  /* back to the page later: what others have got since */
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&L) load(""); });
  load("");
})();
</script>
</body>
</html>
